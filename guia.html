<head>

  <meta name="description" data-es="Todo lo que necesitas para tu estancia en Esmeralda: acceso, WiFi, reglas, instrucciones y recomendaciones." data-en="Everything you need for your stay at Esmeralda: access, WiFi, rules, instructions and recommendations." />

  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a5944" />
  <style>
    @font-face{font-family:'Fraunces';font-style:normal;font-weight:700;font-display:swap;src:url(/assets/fonts/fraunces-700-latin.woff2) format('woff2');}
    @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/inter-400-latin.woff2) format('woff2');}
    @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(/assets/fonts/inter-600-latin.woff2) format('woff2');}
    :root{--emerald:#0f7a5f;--emerald-dark:#0a5944;--aqua:#06d67e;--gold:#A67C00;--ink:#16231f;--cream:#F5F1E8;--white:#fff;--glass:rgba(255,255,255,.55);--glass-border:rgba(255,255,255,.65);--blur:blur(18px) saturate(1.5)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Inter",system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6}
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(55vw 55vw at 15% -8%,rgba(6,214,126,.16),transparent 62%),radial-gradient(45vw 45vw at 104% 22%,rgba(43,196,201,.15),transparent 58%),radial-gradient(65vw 65vw at 45% 115%,rgba(15,122,95,.13),transparent 62%)}
    a{color:var(--emerald)}
    /* Topbar */
    .top{position:sticky;top:.7rem;z-index:20;background:rgba(10,89,68,.78);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:.55rem 1.1rem;margin:.7rem .8rem 0;border-radius:999px;border:1px solid rgba(255,255,255,.25);box-shadow:0 18px 40px -26px rgba(4,38,28,.7)}
    .top .brand{font-family:"Fraunces",serif;font-weight:700;font-size:1.05rem}
    .top .brand .gem{color:var(--aqua)}
    .lang{display:inline-flex;border:1px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden}
    .lang button{background:transparent;border:0;color:#fff;font:600 .78rem "Inter",sans-serif;padding:.3rem .65rem;cursor:pointer;letter-spacing:.04em}
    .lang button.on{background:var(--aqua);color:#062c22}
    /* Hero */
    .hero{background:linear-gradient(160deg,rgba(6,44,34,.82) 0%,rgba(10,89,68,.72) 55%,rgba(15,122,95,.66) 100%),url(/assets/images/caseta-entrance.webp) center/cover no-repeat;color:#fff;padding:2.8rem 1.2rem 2.4rem;text-align:center;border-radius:40px;margin:.9rem .8rem 0;box-shadow:0 24px 48px -28px rgba(10,89,68,.4);text-shadow:0 1px 10px rgba(0,0,0,.3)}
    .hero h1{font-family:"Fraunces",serif;font-size:clamp(2rem,6vw,3rem);margin-bottom:.5rem}
    .hero p{opacity:.95;max-width:560px;margin:0 auto;font-size:1.05rem}
    /* Layout */
    .wrap{max-width:820px;margin:0 auto;padding:1.6rem 1.1rem 4rem}
    /* Quick facts */
    .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:0 0 1.8rem}
    .fact{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:20px;padding:.9rem 1rem}
    .fact .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:700}
    .fact .v{font-size:1rem;font-weight:600;margin-top:.2rem}
    /* TOC */
    .toc{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:24px;padding:1.1rem 1.2rem;margin-bottom:2rem}
    .toc h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:.7rem}
    .toc ol{list-style:none;counter-reset:t;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.3rem .9rem}
    .toc li{counter-increment:t}
    .toc a{text-decoration:none;color:var(--ink);font-size:.95rem;display:flex;gap:.5rem;padding:.25rem 0}
    .toc a::before{content:counter(t);background:var(--cream);color:var(--emerald-dark);font-weight:700;font-size:.78rem;width:1.4rem;height:1.4rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
    /* Sections */
    .sec{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:24px;padding:1.4rem 1.4rem;margin-bottom:1.1rem;scroll-margin-top:80px}
    /* Cada sección se pliega. El h2 sigue siendo h2 (encabezado real), solo que
       vive dentro del <summary> que hace de tirador. */
    .sec > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.55rem}
    .sec > summary::-webkit-details-marker{display:none}
    .sec > summary h2{margin:0}
    .sec > summary::after{content:"+";margin-left:auto;color:var(--gold);font-weight:700;font-size:1.3rem;line-height:1}
    .sec[open] > summary::after{content:"–"}
    .sec[open] > summary{margin-bottom:.8rem}
    .sec h2{font-family:"Fraunces",serif;font-size:1.4rem;color:var(--emerald-dark);display:flex;align-items:center;gap:.55rem}
    .sec h3{font-size:1rem;margin:1rem 0 .35rem;color:var(--ink)}
    .sec p,.sec li{font-size:.97rem;color:#33433d}
    /* Listas: el número/viñeta arranca donde arranca el texto de los párrafos,
       no antes. Antes el <ul> llevaba margen Y el padding del navegador, y el
       <ol> solo el del navegador — por eso se salían. */
    .sec ul,.sec ol{margin:.3rem 0;padding-left:1.35rem}
    .sec li{margin:.25rem 0}
    .sec .ruta{padding-left:0}
    /* Fotos de la guía */
    .foto{margin:.9rem 0 .2rem}
    /* height:auto es obligatorio: el <img> trae width/height reales en el HTML
       (para que no brinque el layout al cargar), y sin esto el alto del atributo
       se aplica tal cual y la foto sale estirada. Son verticales, de celular,
       así que se topan chicas para que no se coman la pantalla en escritorio. */
    .foto img{display:block;width:100%;height:auto;max-width:280px;
      border-radius:18px;border:1px solid var(--glass-border)}
    .foto figcaption{font-size:.88rem;color:#5c6b65;margin-top:.4rem;max-width:280px}
    .note{background:rgba(255,255,255,.6);border:1px solid rgba(166,124,0,.35);border-left:3px solid var(--gold);border-radius:14px;padding:.7rem .9rem;margin:.8rem 0;font-size:.92rem}
    .btn{display:inline-block;background:var(--gold);color:#fff;font-weight:700;text-decoration:none;padding:.7rem 1.4rem;border-radius:999px;margin-top:.6rem}
    /* Ruta de llegada: las 5 paradas, en orden, con la línea que las une.
       Va en vertical a propósito — se lee en el celular y se imprime bien. */
    .ruta{list-style:none;margin:.9rem 0 .3rem;padding:0;position:relative;counter-reset:ruta}
    .ruta li{position:relative;padding:0 0 1.15rem 2.4rem;counter-increment:ruta}
    .ruta li::before{content:counter(ruta);position:absolute;left:0;top:0;width:1.6rem;height:1.6rem;
      border-radius:50%;background:var(--gold);color:#fff;font-weight:700;font-size:.85rem;
      display:flex;align-items:center;justify-content:center}
    /* La línea baja de un número al siguiente; la última parada no la lleva */
    .ruta li:not(:last-child)::after{content:"";position:absolute;left:.77rem;top:1.7rem;bottom:.15rem;
      width:2px;background:rgba(166,124,0,.3)}
    .ruta li b{display:block;margin-bottom:.1rem}
    .ruta li span{display:block;font-size:.93rem;opacity:.88}
    table.fines{width:100%;border-collapse:collapse;margin-top:.6rem;font-size:.92rem}
    table.fines th,table.fines td{text-align:left;padding:.55rem .5rem;border-bottom:1px solid #eee}
    table.fines th{color:var(--gold);text-transform:uppercase;font-size:.72rem;letter-spacing:.06em}
    /* Placeholder (dato pendiente de Rodrigo) */
    .ph{background:#fff4c2;color:#7a5c00;padding:0 .25rem;border-radius:4px;font-weight:600;font-style:normal}
    footer{text-align:center;color:#8a958f;font-size:.85rem;padding:1.5rem 1rem 0}
    footer a{color:var(--gold);text-decoration:none}
  </style>
</head>

  <div class="wrap">

    <div class="facts">

    <!-- 0. Antes de llegar — lo que más se pregunta y lo que más se atora.
         Va primero a propósito: los huéspedes suelen escribir el mismo día,
         muchas veces ya en carretera. -->
    <details class="sec" id="antes" open>
      <summary><h2>✅ <span data-es="Antes de llegar" data-en="Before you arrive"></span></h2></summary>
      <p data-es="Con estos cinco datos adelantamos tu registro y entras rápido por la caseta. Mándanoslos por WhatsApp en cuanto puedas — <strong>si ya vas en camino, no pasa nada: también se resuelve el mismo día</strong>." data-en="With these five items we pre-register you so you get through the gate quickly. Send them over WhatsApp whenever you can — <strong>if you're already on the road, no problem: we can still sort it out the same day</strong>."></p>
      <ol>
        <li data-es="<strong>INE del responsable</strong> — foto por ambos lados." data-en="<strong>Lead guest's photo ID</strong> — picture of both sides."></li>
        <li data-es="<strong>Nombre completo de cada huésped</strong> y cuántos son en total." data-en="<strong>Full name of every guest</strong> and the total headcount."></li>
        <li data-es="<strong>Datos del auto: placas, modelo y color.</strong>" data-en="<strong>Car details: license plate, model and color.</strong>"></li>
        <li data-es="<strong>Última hoja del reglamento, con tu nombre y firma.</strong> Puedes mandarnos una <strong>foto de la hoja firmada por WhatsApp</strong>, o llevarla impresa a la caseta. Descárgala en <a href='/reglamento'>esmeraldalakes.com/reglamento</a>." data-en="<strong>Last page of the condo rules, with your name and signature.</strong> You can send us a <strong>photo of the signed page over WhatsApp</strong>, or bring it printed to the gate. Download it at <a href='/reglamento'>esmeraldalakes.com/reglamento</a>."></li>
        <li data-es="<strong>Comprobante de las pulseras de acceso</strong> — $50 por persona (ver cuenta abajo)." data-en="<strong>Proof of payment for the access wristbands</strong> — $50 MXN per person (account details below)."></li>
      </ol>

      <h3 data-es="Pulseras de acceso — $50 por persona" data-en="Access wristbands — $50 MXN per person"></h3>
      <p data-es="Es un <strong>cobro de la administración del residencial</strong>, no del departamento, y se paga <strong>solo por transferencia</strong>: <strong>no se acepta efectivo</strong>. Sin pulsera no hay acceso a alberca ni áreas comunes." data-en="This is a <strong>charge from the residential administration</strong>, not from the apartment, and it is paid <strong>by bank transfer only</strong>: <strong>cash is not accepted</strong>. Without a wristband there's no access to the pool or common areas."></p>
      <ul>
        <li><strong>Banco:</strong> BBVA</li>
        <li data-es="<strong>Destinatario:</strong> Administración Diamante Lakes Acapulco" data-en="<strong>Recipient:</strong> Administración Diamante Lakes Acapulco"></li>
        <li data-es="<strong>CLABE:</strong> 012261001929045781" data-en="<strong>CLABE:</strong> 012261001929045781"></li>
        <li data-es="<strong>Concepto:</strong> tu nombre + E-205" data-en="<strong>Reference:</strong> your name + E-205"></li>
        <li data-es="<strong>Monto:</strong> $50 × número de personas" data-en="<strong>Amount:</strong> $50 MXN × number of guests"></li>
      </ul>
      <div class="note" data-es="📸 Mándanos el comprobante por WhatsApp y con eso adelantamos tu registro." data-en="📸 Send us the receipt over WhatsApp and we'll pre-register you with it."></div>

      <h3 data-es="¿Vienes con mascota?" data-en="Traveling with a pet?"></h3>
      <p data-es="Avísanos <strong>antes</strong> de llegar. Se permiten con autorización previa: siempre con correa, prohibidas en áreas verdes, alberca y jacuzzi, y hay que recoger sus desechos. Cualquier multa del condominio por la mascota corre por cuenta del huésped." data-en="Let us know <strong>before</strong> you arrive. Pets are allowed with prior approval: always on a leash, not allowed on lawns, in the pool or the jacuzzi, and you must pick up after them. Any condo fine related to the pet is charged to the guest."></p>
    </details>

    <!-- 1. Cómo llegar -->
    <details class="sec" id="llegar">
      <summary><h2>🚗 <span data-es="Cómo llegar" data-en="Getting here"></span></h2></summary>
      <p data-es="<strong>Esmeralda, departamento 205</strong> — Condominio Diamante Lakes, Revolcadero, Puerto Marqués, Acapulco, Gro. Estamos justo al lado de la Arena GNP Seguros." data-en="<strong>Esmeralda, apartment 205</strong> — Diamante Lakes, Revolcadero, Puerto Marqués, Acapulco, Mexico. We're right next to the Arena GNP Seguros."></p>
      <h3 data-es="En auto (desde CDMX / Autopista del Sol)" data-en="By car (from Mexico City / Autopista del Sol)"></h3>
      <p data-es="Toma la salida a <strong>Puerto Marqués / Acapulco Diamante</strong> e incorpórate al <strong>Blvd. de las Naciones</strong> rumbo al aeropuerto. Sigue derecho hasta la <strong>Arena GNP Seguros</strong>: el condominio Diamante Lakes está justo al lado — úsala como referencia." data-en="Take the <strong>Puerto Marqués / Acapulco Diamante</strong> exit and merge onto <strong>Blvd. de las Naciones</strong> toward the airport. Continue straight until you reach the <strong>Arena GNP Seguros</strong>: Diamante Lakes is right next to it — use the arena as your landmark."></p>
      <h3 data-es="Desde el aeropuerto (ACA)" data-en="From the airport (ACA)"></h3>
      <p data-es="A unos <strong>10 minutos</strong> (≈7 km): sal del aeropuerto por el <strong>Blvd. de las Naciones</strong> rumbo a Acapulco Diamante y sigue derecho hasta la Arena GNP Seguros. Recomendamos Uber/Didi o taxi autorizado del aeropuerto." data-en="About <strong>10 minutes</strong> away (≈7 km): leave the airport on <strong>Blvd. de las Naciones</strong> toward Acapulco Diamante and continue straight to the Arena GNP Seguros. We recommend Uber/Didi or an authorized airport taxi."></p>
      <h3 data-es="Desde la Costera / centro" data-en="From the Costera / downtown"></h3>
      <p data-es="Toma la <strong>Carretera Escénica</strong> hacia Puerto Marqués, baja al <strong>Blvd. de las Naciones</strong> y sigue rumbo al aeropuerto hasta la Arena GNP Seguros (20–25 min aprox.)." data-en="Take the <strong>Carretera Escénica</strong> toward Puerto Marqués, exit onto <strong>Blvd. de las Naciones</strong> and continue toward the airport until the Arena GNP Seguros (about 20–25 min)."></p>
      <a class="btn" href="https://maps.google.com/?q=Diamante+Lakes+Revolcadero+Acapulco" target="_blank" rel="noopener" data-es="📍 Abrir en Google Maps" data-en="📍 Open in Google Maps"></a>

      <figure class="foto">
        <img src="/assets/images/llegada-croquis-cluster.webp" width="1000" height="1339" loading="lazy"
             alt="Vista aérea de Diamante Lakes con la ruta marcada desde Blvd. de las Naciones hasta el cluster Esmeralda" />
        <figcaption data-es="Entras por Blvd. de las Naciones; las flechas marcan el camino hasta nuestro cluster." data-en="You come in from Blvd. de las Naciones; the arrows show the way to our cluster."></figcaption>
      </figure>

      <h3 data-es="De la entrada a la puerta del depa" data-en="From the gate to the apartment door"></h3>
      <p data-es="Cinco paradas, en este orden. Cada una tiene su requisito — por eso conviene traerlos listos." data-en="Five stops, in this order. Each one has its requirement — that's why it helps to have them ready."></p>
      <ol class="ruta">
        <li>
          <b data-es="Arena GNP Seguros" data-en="Arena GNP Seguros"></b>
          <span data-es="Tu referencia sobre Blvd. de las Naciones. Diamante Lakes está justo al lado." data-en="Your landmark on Blvd. de las Naciones. Diamante Lakes is right next to it."></span>
        </li>
        <li>
          <b data-es="Caseta de vigilancia" data-en="Security gate"></b>
          <span data-es="Da el nombre de la reservación. Presenta <strong>INE</strong> y la <strong>hoja del reglamento firmada</strong>. Te dan el pase del carro (se devuelve al salir)." data-en="Give the booking name. Show your <strong>photo ID</strong> and the <strong>signed rules page</strong>. They hand you a car pass (returned when you leave)."></span>
        </li>
        <li>
          <b data-es="Administración" data-en="Administration office"></b>
          <span data-es="Pasan <strong>todos los huéspedes</strong> por sus pulseras. Ya pagadas por transferencia." data-en="<strong>All guests</strong> stop here for their wristbands. Already paid by transfer."></span>
        </li>
        <li>
          <b data-es="Estacionamiento del cluster" data-en="Cluster parking"></b>
          <span data-es="Solo el <strong>cajón asignado al 205</strong>, justo enfrente del departamento. Máx. 10 km/h dentro del residencial." data-en="Only the <strong>spot assigned to 205</strong>, right in front of the apartment. Max 10 km/h inside the complex."></span>
        </li>
        <li>
          <b data-es="Esmeralda 205" data-en="Esmeralda 205"></b>
          <span data-es="Planta alta. Abre con el <strong>código que te mandamos por WhatsApp</strong> una hora antes." data-en="Upper floor. Open with the <strong>code we send you on WhatsApp</strong> an hour before."></span>
        </li>
      </ol>
    </details>

    <!-- 2. Acceso -->
    <details class="sec" id="acceso">
      <summary><h2>🚪 <span data-es="Acceso y entrada" data-en="Access & entry"></span></h2></summary>
      <h3 data-es="Entrada al condominio" data-en="Condo entrance"></h3>
      <p data-es="En la caseta de vigilancia da el <strong>nombre con el que se hizo la reservación</strong> y deja una <strong>identificación</strong>; te darán un <strong>pase para el carro</strong>, que se entrega al salir." data-en="At the security booth give the <strong>name used for the booking</strong> and leave an <strong>ID</strong>; you'll receive a <strong>car pass</strong>, which you return when you leave."></p>
      <h3 data-es="Entrada al departamento" data-en="Apartment entry"></h3>
      <p data-es="El departamento tiene <strong>cerradura inteligente</strong>: te enviamos el código <strong>por WhatsApp, alrededor de una hora antes de tu llegada</strong>." data-en="The apartment has a <strong>smart lock</strong>: we send you the code <strong>via WhatsApp, about an hour before you arrive</strong>."></p>
      <div class="note" data-es="🔐 Por tu seguridad y la del depa, el código cambia entre estancias. Si no te abre a la primera, escríbenos por WhatsApp y lo resolvemos en el momento." data-en="🔐 For your safety and the apartment's, the code changes between stays. If it doesn't work on the first try, message us on WhatsApp and we'll sort it out right away."></div>
    </details>

    <!-- 3. WiFi y entretenimiento -->
    <details class="sec" id="wifi">
      <summary><h2>📶 <span data-es="WiFi y entretenimiento" data-en="WiFi & entertainment"></span></h2></summary>
      <p data-es="Los accesos del WiFi (red y contraseña) están <strong>disponibles en el módem</strong>." data-en="The WiFi details (network and password) are <strong>available on the modem</strong>."></p>
      <p data-es="Smart TV con <strong>Netflix y canales de televisión</strong>. Si inicias sesión con tu propia cuenta, recuerda cerrarla antes de salir." data-en="Smart TV with <strong>Netflix and cable channels</strong>. If you sign in with your own account, remember to log out before leaving."></p>
    </details>
